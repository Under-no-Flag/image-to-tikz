name: skill-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-lang-chinese texlive-latex-extra poppler-utils fonts-noto-cjk
      - run: python -m pip install -r skills/image-to-tikz/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/package_skill.py
